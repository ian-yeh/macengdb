name: CI Lint and Build Checks

on: 
  push:
    branches:
      - '**'
  pull_request:
    branches: [ main ]

jobs:
  api-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: macengdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Load baseline schema
        run: psql postgres://postgres:postgres@localhost:5432/macengdb -v ON_ERROR_STOP=1 -f migrations/0000_baseline.sql
      - name: Type check
        run: npx tsc --noEmit
      - name: Test
        run: npx vitest run

  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Build check
        run: cd frontend && npm run build